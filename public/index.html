<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>ระบบตรวจสอบคะแนน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.5 3 6 3s6-2 6-3v-5"/></svg>
      </span>
      <span class="brand-text">ระบบตรวจสอบคะแนน</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="user">ผู้ใช้</button>
      <button class="tab" data-view="admin">Admin</button>
    </nav>
  </header>

  <main id="app">
    <!-- ============ USER VIEW ============ -->
    <section id="view-user" class="view active">
      <div class="card lookup-card">
        <h1>ตรวจสอบคะแนน</h1>
        <p class="hint">กรอกรหัสนักเรียน (ID STD) เพื่อดูคะแนนรายวิชา</p>
        <form id="lookupForm" class="lookup-form">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="lookupId" placeholder="เช่น 66010001" autocomplete="off" inputmode="numeric" required />
          </div>
          <button type="submit" class="btn btn-primary" id="lookupBtn">ตรวจสอบ</button>
        </form>
        <div id="lookupMsg" class="msg"></div>
      </div>

      <div id="resultBox" class="result-box hidden">
        <div class="card student-card">
          <div class="student-head">
            <div class="avatar" id="studentAvatar"></div>
            <div class="student-meta">
              <div class="student-name" id="studentName"></div>
              <div class="student-id" id="studentId"></div>
            </div>
          </div>
          <div class="meta-line" id="statsRow"></div>
          <table class="score-table">
            <thead>
              <tr><th>วิชา</th><th class="col-score">คะแนน</th></tr>
            </thead>
            <tbody id="scoreBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ============ ADMIN VIEW ============ -->
    <section id="view-admin" class="view">
      <div id="adminLogin" class="card login-card">
        <h2>เข้าสู่ระบบ Admin</h2>
        <p class="hint">กรุณาใส่รหัสผ่านเพื่อจัดการข้อมูลนักเรียน</p>
        <form id="loginForm" class="login-form">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="adminPassword" placeholder="รหัสผ่าน" required />
          </div>
          <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        </form>
        <div id="loginMsg" class="msg"></div>
        <p class="hint small">รหัสผ่านเริ่มต้น: <code>admin123</code></p>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="admin-header">
          <div class="admin-title">
            <h2>จัดการข้อมูลนักเรียน</h2>
            <p class="hint" id="adminCount"></p>
          </div>
          <button id="logoutBtn" class="btn btn-ghost btn-sm">ออกจากระบบ</button>
        </div>
        <button id="addBtn" class="btn btn-primary btn-block">+ เพิ่มนักเรียน</button>
        <div id="adminMsg" class="msg"></div>
        <div id="studentList" class="student-list"></div>
      </div>
    </section>
  </main>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">เพิ่มนักเรียน</h3>
        <button id="modalClose" class="icon-btn" aria-label="ปิด" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="studentForm" class="student-form">
        <input type="hidden" id="formId" />
        <div class="field">
          <label for="formIdStd">รหัสนักเรียน (ID STD) <em>*</em></label>
          <input type="text" id="formIdStd" placeholder="เช่น 66010001" required />
        </div>
        <div class="field">
          <label for="formName">ชื่อ-สกุล</label>
          <input type="text" id="formName" placeholder="เช่น สมชาย ใจดี" />
        </div>
        <div class="field">
          <label>รูปภาพ</label>
          <label class="dropzone" id="dropzone">
            <input type="file" id="formPicture" accept="image/*" />
            <img id="formPicturePreview" src="" alt="" class="pic-preview hidden" />
            <div class="dropzone-empty" id="dropzoneEmpty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
              <span>เลือกรูปภาพนักเรียน</span>
            </div>
          </label>
          <button type="button" id="clearPictureBtn" class="btn btn-ghost btn-sm hidden">ลบรูป</button>
        </div>

        <div class="subjects-block">
          <div class="subjects-head">
            <span>รายวิชาและคะแนน</span>
            <button type="button" id="addSubjectBtn" class="btn btn-ghost btn-sm">+ เพิ่มวิชา</button>
          </div>
          <div id="subjectRows"></div>
        </div>

        <div id="formMsg" class="msg"></div>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn btn-ghost" data-close>ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
